<svg xmlns="http://www.w3.org/2000/svg" width="460" height="392" viewBox="0 0 460 392" role="img" aria-label="Model ladder for Claude. Haiku low for score 0 to 1, Sonnet low for 2 to 4, Sonnet medium for 5 to 6, Opus medium for 7 to 9, Opus high for 10 to 12, Opus max for 13 to 15.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .l{font-size:13.5px;fill:#a7aca8} .n{font-size:14.5px;font-weight:600;fill:#f3f2ea} .sc{font-size:12.5px;fill:#d9dcd6}
  </style>
  <rect x="0.5" y="0.5" width="459" height="391" rx="16" fill="#16191c" stroke="rgba(243,242,234,0.14)"/>
  <text class="l" x="20" y="28">Lookups, formatting, simple questions</text>
  <rect x="20" y="36" width="420" height="34" rx="8" fill="#ff5a4a" fill-opacity="0.1" stroke="#ff5a4a" stroke-opacity="0.85"/>
  <text class="n" x="32" y="58">Haiku · low</text>
  <text class="sc" x="428" y="58" text-anchor="end">score 0–1</text>
  <text class="l" x="20" y="90">Small clear edits and answers</text>
  <rect x="20" y="98" width="420" height="34" rx="8" fill="#ff5a4a" fill-opacity="0.18" stroke="#ff5a4a" stroke-opacity="0.85"/>
  <text class="n" x="32" y="120">Sonnet · low</text>
  <text class="sc" x="428" y="120" text-anchor="end">score 2–4</text>
  <text class="l" x="20" y="152">Routine work</text>
  <rect x="20" y="160" width="420" height="34" rx="8" fill="#ff5a4a" fill-opacity="0.28" stroke="#ff5a4a" stroke-opacity="0.85"/>
  <text class="n" x="32" y="182">Sonnet · medium</text>
  <text class="sc" x="428" y="182" text-anchor="end">score 5–6</text>
  <text class="l" x="20" y="214">Multi-file work with a clear goal</text>
  <rect x="20" y="222" width="420" height="34" rx="8" fill="#ff5a4a" fill-opacity="0.4" stroke="#ff5a4a" stroke-opacity="0.85"/>
  <text class="n" x="32" y="244">Opus · medium</text>
  <text class="sc" x="428" y="244" text-anchor="end">score 7–9</text>
  <text class="l" x="20" y="276">Hard debugging, design, subtle trade-offs</text>
  <rect x="20" y="284" width="420" height="34" rx="8" fill="#ff5a4a" fill-opacity="0.55" stroke="#ff5a4a" stroke-opacity="0.85"/>
  <text class="n" x="32" y="306">Opus · high</text>
  <text class="sc" x="428" y="306" text-anchor="end">score 10–12</text>
  <text class="l" x="20" y="338">Deep architecture, security</text>
  <rect x="20" y="346" width="420" height="34" rx="8" fill="#ff5a4a" fill-opacity="0.72" stroke="#ff5a4a" stroke-opacity="0.85"/>
  <text class="n" x="32" y="368">Opus · max</text>
  <text class="sc" x="428" y="368" text-anchor="end">score 13–15</text>
</svg>
