<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="512" role="img" aria-label="Model ladder. Harder tasks get a stronger model. Claude: Haiku low, Sonnet low, Sonnet medium, Opus medium, Opus high, Opus max. ChatGPT and Codex: GPT-5.6 Luna low, GPT-5.6 Terra low, GPT-5.6 Sol medium, GPT-6 Sol high, GPT-6.1 Sol high, GPT-6 Astra high.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .h{font-size:14px;font-weight:700}
    .l{font-size:13px;fill:#a7aca8}
    .n{font-size:13.5px;font-weight:600;fill:#f3f2ea}
    .sc{font-size:11.5px;fill:#d9dcd6}
    @media (max-width:520px){ .n{font-size:12.5px} .l{font-size:12px} .sc{font-size:11px} }
  </style>
  <rect x="0.5" y="0.5" width="99.9%" height="511" rx="16" fill="#16191c" stroke="rgba(243,242,234,0.14)"/>
  <text class="l" x="3%" y="66">Lookups, formatting, simple questions</text>
  <text class="l" x="3%" y="142">Small clear edits and answers</text>
  <text class="l" x="3%" y="218">Routine work</text>
  <text class="l" x="3%" y="294">Multi-file work with a clear goal</text>
  <text class="l" x="3%" y="370">Hard debugging, design, subtle trade-offs</text>
  <text class="l" x="3%" y="446">Deep architecture, security</text>
  <svg x="3%" y="0" width="46%" height="512" overflow="visible">
    <text class="h" x="0" y="30" fill="#ff5a4a">Claude</text>
    <rect x="0" y="74" width="100%" height="44" rx="8" fill="#ff5a4a" fill-opacity="0.1" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="93">Haiku · low</text>
    <text class="sc" x="11" y="110">score 0–1</text>
    <rect x="0" y="150" width="100%" height="44" rx="8" fill="#ff5a4a" fill-opacity="0.18" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="169">Sonnet · low</text>
    <text class="sc" x="11" y="186">score 2–4</text>
    <rect x="0" y="226" width="100%" height="44" rx="8" fill="#ff5a4a" fill-opacity="0.28" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="245">Sonnet · medium</text>
    <text class="sc" x="11" y="262">score 5–6</text>
    <rect x="0" y="302" width="100%" height="44" rx="8" fill="#ff5a4a" fill-opacity="0.4" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="321">Opus · medium</text>
    <text class="sc" x="11" y="338">score 7–9</text>
    <rect x="0" y="378" width="100%" height="44" rx="8" fill="#ff5a4a" fill-opacity="0.55" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="397">Opus · high</text>
    <text class="sc" x="11" y="414">score 10–12</text>
    <rect x="0" y="454" width="100%" height="44" rx="8" fill="#ff5a4a" fill-opacity="0.72" stroke="#ff5a4a" stroke-opacity="0.85"/>
    <text class="n" x="11" y="473">Opus · max</text>
    <text class="sc" x="11" y="490">score 13–15</text>
  </svg>
  <svg x="51%" y="0" width="46%" height="512" overflow="visible">
    <text class="h" x="0" y="30" fill="#3d8bff">ChatGPT and Codex</text>
    <rect x="0" y="74" width="100%" height="44" rx="8" fill="#3d8bff" fill-opacity="0.1" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="93">GPT-5.6 Luna · low</text>
    <text class="sc" x="11" y="110">score 0–1</text>
    <rect x="0" y="150" width="100%" height="44" rx="8" fill="#3d8bff" fill-opacity="0.18" stroke="#3d8bff" stroke-opacity="0.85"/>
