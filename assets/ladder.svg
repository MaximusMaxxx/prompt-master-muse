    <text class="sc" x="11" y="186">score 2–4</text>
    <rect x="0" y="226" width="100%" height="44" rx="8" fill="#3d8bff" fill-opacity="0.28" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="245">GPT-5.6 Sol · medium</text>
    <text class="sc" x="11" y="262">score 5–7</text>
    <rect x="0" y="302" width="100%" height="44" rx="8" fill="#3d8bff" fill-opacity="0.4" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="321">GPT-6 Sol · high</text>
    <text class="sc" x="11" y="338">score 8–9</text>
    <rect x="0" y="378" width="100%" height="44" rx="8" fill="#3d8bff" fill-opacity="0.55" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="397">GPT-6.1 Sol · high</text>
    <text class="sc" x="11" y="414">score 10–11</text>
    <rect x="0" y="454" width="100%" height="44" rx="8" fill="#3d8bff" fill-opacity="0.72" stroke="#3d8bff" stroke-opacity="0.85"/>
    <text class="n" x="11" y="473">GPT-6 Astra · high</text>
    <text class="sc" x="11" y="490">score 12–15</text>
